                                        </a>
                                        <a href="javascript:void(0);" class="btn btn-light-brand flex-fill" data-bs-toggle="tooltip" data-bs-trigger="hover" title="Login with Github">

                                        </a>
                                    </div>
                                </div>

        </div>
    </main>
   
<script>
$(document).ready(function () {
    $('#loginForm').on('submit', function (e) {
        e.preventDefault(); // Prevent the default form submission
        
        // Show loader
        $('#loader').show();
        
        // Prepare form data
        var formData = $(this).serialize();

        // Submit form data via AJAX
        $.ajax({
            url: 'processor.php?login', // PHP script to process login
            type: 'POST',
            data: formData,
            dataType: 'json', // Ensure that we expect JSON response
            success: function (response) {
                // Hide loader
                $('#loader').hide();
                
                // Check if the response has status success
                if (response.status === 'success') {
                    iziToast.success({
                        title: 'Success',
                        message: response.message,
                        position: 'topRight'
                    });
                    // Redirect after successful login (optional)
                    window.location.href = 'dashboard';
                } else {
                    iziToast.error({
                        title: 'Error',
                        message: response.message,
                        position: 'topRight'
                    });
                }
            },
            error: function (jqXHR, textStatus, errorThrown) {
                // Hide loader
                $('#loader').hide();
                
                // Display error notification
                iziToast.error({
                    title: 'Error',
                    message: 'Login failed. Please try again.',
                    position: 'topRight'
                });

                // Optional: log the error to the console
                console.log('AJAX Error: ' + textStatus + ': ' + errorThrown);
            }
        });
    });
});
</script>
